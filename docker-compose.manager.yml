services:
  web:
    networks:
      - default
      - sail-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=sail-proxy
      - traefik.http.routers.finance.rule=Host(`finance.test`)
      - traefik.http.routers.finance.entrypoints=websecure
      - traefik.http.routers.finance.tls=true
      - traefik.http.services.finance.loadbalancer.server.port=80

networks:
  sail-proxy:
    external: true